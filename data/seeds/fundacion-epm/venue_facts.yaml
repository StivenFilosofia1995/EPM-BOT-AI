# Hechos estables de cada espacio: horarios, tarifas, gratuidades, requisitos.
# Fuente: KB_FUNDACION_EPM.md §3 — verificado 2026-08-03.
#
# REGLA DE ORO: todo dato lleva `source_url` y `verified_at`. Un dato sin
# fuente no entra a la base.
#
# OMISIONES DELIBERADAS (KB §5 «Pendiente»). No se inventan:
#   - Horario general de la Biblioteca EPM: solo se conoce el de préstamo y
#     devolución, que es lo único que se carga aquí.
#   - Horarios de atención de las 14 UVA: no publicados. Ninguna UVA tiene
#     hechos de horario.
#   - Calendario de cierres por festivos: la regla del Museo («primer día
#     hábil de la semana») es ambigua cuando el lunes es festivo y requiere
#     decisión explícita del negocio.
#   - Correo público del Parque de los Deseos: el conocido es personal.

