upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # --- Cabeceras de seguridad ---
    # En producción, detrás de TLS, añadir además:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # --- API ---
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_read_timeout 60s;
    }

    # --- Healthcheck del backend ---
    location = /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # --- Documentación OpenAPI (deshabilitar en producción si aplica) ---
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://backend_upstream;
    }

    # --- Frontend ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_read_timeout 60s;
    }
}
