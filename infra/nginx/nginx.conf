user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rid=$request_id';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # No revelar la versión de nginx en cabeceras ni páginas de error.
    server_tokens   off;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    application/xml text/xml image/svg+xml;
    gzip_min_length 1024;

    # Límite global del cuerpo de la petición. Los webhooks de Meta son pequeños;
    # el margen es para cargas de archivos del panel (p. ej. .xlsx de programación).
    client_max_body_size 10m;
    client_body_timeout  30s;
    client_header_timeout 15s;

    include /etc/nginx/conf.d/*.conf;
}
