[project]
name = "epm-wa-platform-backend"
version = "0.1.0"
description = "Backend de epm-wa-platform: plataforma SaaS multitenant de bots de WhatsApp Business sobre la API oficial de Meta."
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "asyncpg>=0.30,<1.0",
    "pgvector>=0.3,<1.0",
    "httpx>=0.27,<1.0",
    "structlog>=24.4,<25.0",
    "redis>=5.2,<6.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    # >=9.0.3 por PYSEC-2026-1845 (DoS/escalada vía /tmp/pytest-of-{user}).
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "pip-audit>=2.7,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- Ruff ---------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "ASYNC", # flake8-async
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# `sqlalchemy.dialects.postgresql.UUID` es una clase de tipo, no una constante:
# ruff la confunde por el nombre en mayúsculas. El alias `PgUUID` es la
# convención habitual para no chocar con `uuid.UUID`, que también se importa.
"src/infrastructure/database/models/*.py" = ["N811"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# --- Mypy -----------------------------------------------------------------

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "."
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# --- Pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requiere base de datos real (se salta si no hay conexión)",
]
