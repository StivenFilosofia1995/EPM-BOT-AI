version: '3'

# POC aislado para validar ADR 010 (docs/adr/010-chatwoot-como-capa-de-mensajeria.md).
# No forma parte de la infraestructura del proyecto todavía — no tocar el
# docker-compose.yml de la raíz hasta que el ADR se acepte.
#
# Basado en el docker-compose.production.yaml oficial de chatwoot/chatwoot
# (rama develop, verificado 2026-08-04), con puertos remapeados para no chocar
# con el docker-compose.yml del backend/frontend del proyecto (que usa 80,
# 6379 vía nginx) si se levantan ambos a la vez.

services:
  base: &base
    image: chatwoot/chatwoot:latest
    env_file: .env
    volumes:
      - storage_data:/app/storage

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '127.0.0.1:3010:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']
    restart: always

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6389:6379'

volumes:
  storage_data:
  postgres_data:
  redis_data:
